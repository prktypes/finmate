name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        python-version: [3.11]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: finmate_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run backend tests
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/finmate_test
        ENVIRONMENT: testing
      run: |
        cd backend
        pytest tests/ -v

    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --watchAll=false --coverage

    - name: Lint backend code
      run: |
        cd backend
        flake8 app/ --max-line-length=88 --extend-ignore=E203,W503
        black --check app/
        isort --check-only app/

    - name: Lint frontend code
      run: |
        cd frontend
        npm run lint

    - name: Type check frontend
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Build Docker images
      if: github.ref == 'refs/heads/main'
      run: |
        docker-compose build

    - name: Run Docker-compose test
      if: github.ref == 'refs/heads/main'
      run: |
        docker-compose up -d
        sleep 10
        docker-compose ps
        docker-compose down

  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
    - uses: actions/checkout@v4

    - name: Run security audit on Python dependencies
      uses: pyupio/safety-action@v1
      with:
        db-key: ${{ secrets.SAFETY_DB_KEY }}
        output-format: json

    - name: Run security audit on Node.js dependencies
      uses: npm/audit-action@v1
      with:
        args: --json

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/finmate-backend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/finmate-backend:cache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/finmate-backend:cache,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/finmate-frontend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/finmate-frontend:cache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/finmate-frontend:cache,mode=max

    - name: Deploy to staging (example)
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # For example: kubectl apply -f k8s/staging/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add your production deployment commands here
        # For example: kubectl apply -f k8s/production/

    - name: Send deployment notification
      if: always()
      run: |
        echo "Deployment completed"
